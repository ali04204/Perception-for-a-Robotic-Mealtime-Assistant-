[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prma"
version = "0.1.0"
requires-python = ">=3.10"
description = "Perception for a Robotic Mealtime Assistant"
readme = "README.md"
dependencies = [
  "numpy",
  "pandas",
  "opencv-python",
  "mediapipe",
  "scikit-learn",
  "matplotlib",
  "pyyaml",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
